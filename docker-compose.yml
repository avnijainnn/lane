services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lane
      POSTGRES_USER: lane
      POSTGRES_PASSWORD: lane_local_only
    volumes:
      - lane_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lane -d lane"]
      interval: 3s
      retries: 15
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: python -m app.worker
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes:
  lane_pg:
